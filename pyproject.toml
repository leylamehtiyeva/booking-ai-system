[project]
name = "booking-ai-agent"
version = "0.1.0"
description = "Constraint-aware conversational booking assistant with deterministic decision-making and controlled LLM usage"
readme = "README.md"
requires-python = ">=3.11.8"
dependencies = [
    "apify-client>=2.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "google-adk>=0.1.0",
    "streamlit>=1.44.0",


]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]
